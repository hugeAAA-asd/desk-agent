<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Agent · 售后客服</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e3e6ea;
    --text: #1c1f23;
    --muted: #6b7280;
    --accent: #1f6feb;
    --tool: #7c3aed;
    --warn: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input {
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
    font: inherit; color: inherit; background: #fff; outline: none;
  }
  input:focus { border-color: var(--accent); }
  #token { flex: 1 1 260px; min-width: 180px; }
  button {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); }
  #send:hover { color: #fff; opacity: .9; }
  .muted { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 760px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--accent); color: #fff; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; color: var(--tool); background: #f3f0ff;
    border: 1px solid #e4dcff; border-radius: 999px; padding: 2px 8px;
    cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.fail { color: var(--warn); background: #fff1f0; border-color: #ffd6d2; }
  .detail {
    display: none; font-size: 12px; color: var(--muted); background: #fafbfc;
    border: 1px solid var(--line); border-left: 3px solid var(--tool);
    border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word;
  }
  .detail.open { display: block; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; }
  #msg { flex: 1; }
  .err { color: var(--warn); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Desk Agent · 售后客服</h1>
  <div class="row">
    <input id="token" type="password" placeholder="粘贴访问令牌（python -m scripts.mint_token C1001）">
    <button id="save">使用</button>
    <span id="who" class="muted">未登录</span>
  </div>
</header>

<main id="log">
  <div class="msg bot">
    <div class="bubble">先粘贴访问令牌，然后可以问订单、物流、退换货政策。

试试这几句：
- 我的键盘到哪了
- 七天无理由退货要满足什么条件
- 你们支持花呗分期吗（应该拒答）
- 键盘轴没反应，要换货，转人工</div>
  </div>
</main>

<footer>
  <input id="msg" placeholder="输入问题…" autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let token = localStorage.getItem("desk_token") || "";
let sessionId = null;

// 演示页把 token 放 localStorage：方便，但也意味着任何 XSS 都能读走它。
// 真实产品应该用 HttpOnly Cookie + CSRF 防护，这里不做是因为这个页面
// 只想证明「流式 + 工具轨迹」能跑通。
if (token) { $("token").value = token; }

$("save").onclick = () => {
  token = $("token").value.trim();
  if (!token) return;
  localStorage.setItem("desk_token", token);
  sessionId = null;
  $("who").textContent = "令牌已保存";
};

function addUser(text) {
  const wrap = document.createElement("div");
  wrap.className = "msg user";
  wrap.innerHTML = '<div class="bubble"></div>';
  wrap.querySelector(".bubble").textContent = text;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function addBot() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.innerHTML = '<div class="chips"></div><div class="bubble"></div>';
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return {
    wrap,
    chips: wrap.querySelector(".chips"),
    bubble: wrap.querySelector(".bubble"),
    addChip(step) {
      const chip = document.createElement("span");
      const failed = /^(错误|调用失败|订单不存在)/.test(step.result || "");
      chip.className = "chip" + (failed ? " fail" : "");
      chip.textContent = step.tool;
      const detail = document.createElement("div");
      detail.className = "detail";
      detail.textContent = "参数：" + JSON.stringify(step.args) + "\n结果：" + (step.result || "");
      chip.onclick = () => detail.classList.toggle("open");
      this.chips.appendChild(chip);
      this.chips.appendChild(detail);
      log.scrollTop = log.scrollHeight;
    },
    append(text) {
      this.bubble.textContent += text;
      log.scrollTop = log.scrollHeight;
    },
    fail(text) {
      const p = document.createElement("div");
      p.className = "err";
      p.textContent = text;
      this.wrap.appendChild(p);
    },
  };
}

async function send() {
  const text = $("msg").value.trim();
  if (!text) return;
  if (!token) { alert("先粘贴访问令牌"); return; }

  $("msg").value = "";
  $("send").disabled = true;
  addUser(text);
  const bot = addBot();

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      bot.fail("请求失败 " + res.status + "：" + (body.detail || res.statusText));
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data:")) continue;
        const data = part.slice(5).trim();
        if (data === "[DONE]") continue;
        let event;
        try { event = JSON.parse(data); } catch (_) { continue; }
        if (event.type === "delta") bot.append(event.text);
        else if (event.type === "step") bot.addChip(event);
        else if (event.type === "done") sessionId = event.session_id || sessionId;
        else if (event.type === "error") bot.fail(event.message);
      }
    }
  } catch (err) {
    bot.fail("网络错误：" + err.message);
  } finally {
    $("send").disabled = false;
    $("msg").focus();
  }
}

$("send").onclick = send;
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
